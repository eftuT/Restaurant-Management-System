<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SEN'Q RESTAURANT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .signup-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            background: linear-gradient(135deg, #1a1a1a, #3d2b1f);
            padding: 30px 20px;
        }
        .signup-box {
            background: #fff;
            padding: 40px 35px;
            border-radius: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .signup-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c1f16;
        }
        .signup-box label {
            font-weight: 600;
            display: block;
            margin-top: 12px;
        }
        .signup-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 40px;
            margin-top: 4px;
        }
        .signup-box .btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
        }
        .signup-box .links {
            text-align: center;
            margin-top: 20px;
        }
        .signup-box .links a {
            color: #b45f2b;
            font-weight: 600;
        }
        .signup-box .links a:hover {
            text-decoration: underline;
        }
        .signup-box p {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="signup-page">
    <div class="signup-box">
        <h2>Sign Up</h2>
        <p>If you are new to our restaurant, just sign up here.</p>
        <form>
            <label>Email</label>
            <input type="email" placeholder="Enter Email" required>
            <label>Password</label>
            <input type="password" placeholder="Enter Password" required>
            <label>Confirm Password</label>
            <input type="password" placeholder="Repeat Password" required>
            <div style="margin-top:12px;">
                <label><input type="checkbox" checked> Remember me</label>
            </div>
            <p>By creating an account you agree to our <a href="#" style="color:#b45f2b;">Terms & Privacy</a>.</p>
            <button type="submit" class="btn">Sign Up</button>
            <div class="links">Already have an account? <a href="login.html">Log in</a></div>
        </form>
    </div>
</div>

</body>
</html>
