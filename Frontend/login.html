<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SEN'Q Restaurant</title>
    <link rel="stylesheet" href="resources/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4a085e9b53.js" crossorigin="anonymous"></script>
    <style>
        .auth-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            background: linear-gradient(135deg, #2c1f16, #4a3428);
            padding: 30px 20px;
        }
        .auth-box {
            background: #fff;
            padding: 40px 35px;
            border-radius: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .auth-box h2 { text-align: center; color: #2c1f16; margin-bottom: 10px; }
        .auth-box .sub { text-align: center; color: #666; margin-bottom: 20px; }
        .auth-box label { font-weight: 600; display: block; margin-top: 12px; }
        .auth-box input { width: 100%; padding: 12px 16px; border: 1px solid #ccc; border-radius: 40px; margin-top: 4px; }
        .auth-box .btn { width: 100%; margin-top: 20px; padding: 14px; }
        .auth-box .links { text-align: center; margin-top: 20px; }
        .auth-box .links a { color: #b45f2b; font-weight: 600; }
        .auth-box .links a:hover { text-decoration: underline; }
        .auth-box .error { background: #fee; color: #c00; padding: 10px; border-radius: 10px; margin-bottom: 15px; text-align: center; display: none; }
        .auth-box .success { background: #efe; color: #060; padding: 10px; border-radius: 10px; margin-bottom: 15px; text-align: center; display: none; }
        .remember { display: flex; justify-content: space-between; margin-top: 12px; }
        .remember a { color: #b45f2b; }
        .auth-box img { display: block; margin: 0 auto 20px; height: 60px; }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-box">
        <img src="resources/images/logo.jpg" alt="SEN'Q">
        <h2>Log in</h2>
        <p class="sub">Welcome back to SEN'Q</p>
        
        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <div class="remember">
                <label><input type="checkbox" id="remember"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="links">
                Don't have an account? <a href="signup.html">Sign up now</a>
            </div>
        </form>
    </div>
</div>

<script>
function handleLogin(event) {
    event.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';

    fetch('../backend/api/auth/login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, remember })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('successMsg').textContent = data.message;
            document.getElementById('successMsg').style.display = 'block';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        } else {
            document.getElementById('errorMsg').textContent = data.message;
            document.getElementById('errorMsg').style.display = 'block';
        }
    })
    .catch(error => {
        document.getElementById('errorMsg').textContent = 'Connection error. Please try again.';
        document.getElementById('errorMsg').style.display = 'block';
    });
}
</script>

</body>
</html>
