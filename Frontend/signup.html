<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SEN'Q Restaurant</title>
    <link rel="stylesheet" href="resources/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4a085e9b53.js" crossorigin="anonymous"></script>
    <style>
        .auth-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            background: linear-gradient(135deg, #1a1a1a, #3d2b1f);
            padding: 30px 20px;
        }
        .auth-box {
            background: #fff;
            padding: 40px 35px;
            border-radius: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .auth-box h2 { text-align: center; color: #2c1f16; }
        .auth-box .sub { text-align: center; color: #666; margin-bottom: 20px; font-size: 0.9rem; }
        .auth-box label { font-weight: 600; display: block; margin-top: 10px; }
        .auth-box input { width: 100%; padding: 12px 16px; border: 1px solid #ccc; border-radius: 40px; margin-top: 4px; }
        .auth-box .btn { width: 100%; margin-top: 20px; padding: 14px; }
        .auth-box .links { text-align: center; margin-top: 20px; }
        .auth-box .links a { color: #b45f2b; font-weight: 600; }
        .auth-box .links a:hover { text-decoration: underline; }
        .auth-box .error { background: #fee; color: #c00; padding: 10px; border-radius: 10px; margin-bottom: 15px; text-align: center; display: none; }
        .auth-box .success { background: #efe; color: #060; padding: 10px; border-radius: 10px; margin-bottom: 15px; text-align: center; display: none; }
        .auth-box .terms { font-size: 0.85rem; color: #666; margin-top: 12px; text-align: center; }
        .auth-box .terms a { color: #b45f2b; }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-box">
        <h2>Sign Up</h2>
        <p class="sub">Join SEN'Q and experience authentic Ethiopian cuisine</p>
        
        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>

            <label>Username</label>
            <input type="text" id="username" placeholder="Choose a username" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create a password (min 6 chars)" required minlength="6">

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

            <label>Phone (optional)</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">

            <label>Address (optional)</label>
            <input type="text" id="address" placeholder="Enter your address">

            <div style="margin-top:12px;">
                <label><input type="checkbox" id="terms" required> I agree to the <a href="#">Terms & Privacy</a></label>
            </div>

            <button type="submit" class="btn">Create Account</button>

            <div class="links">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </form>
    </div>
</div>

<script>
function handleSignup(event) {
    event.preventDefault();
    
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('successMsg').style.display = 'none';

    if (password !== confirmPassword) {
        document.getElementById('errorMsg').textContent = 'Passwords do not match';
        document.getElementById('errorMsg').style.display = 'block';
        return;
    }

    const data = {
        full_name: document.getElementById('fullName').value,
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: password,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value
    };

    fetch('../backend/api/auth/register.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('successMsg').textContent = data.message;
            document.getElementById('successMsg').style.display = 'block';
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        } else {
            document.getElementById('errorMsg').textContent = data.message;
            document.getElementById('errorMsg').style.display = 'block';
        }
    })
    .catch(error => {
        document.getElementById('errorMsg').textContent = 'Connection error. Please try again.';
        document.getElementById('errorMsg').style.display = 'block';
    });
}
</script>

</body>
</html>
